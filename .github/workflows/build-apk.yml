name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'semantic-release dry run (no tag, no release)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject release signing (keystore from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/duitqu-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=duitqu
          storeFile=duitqu-release.jks
          EOF
      - name: CI memory limits for Gradle/Kotlin
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i '/kotlin.incremental/d' android/gradle.properties
          cat android/gradle.properties
      - name: Recreate Android scaffolding (wrapper)
        run: |
          flutter create --platforms=android --project-name duitqu --org id.chulit /tmp/skel
          cp -r /tmp/skel/android/gradle android/
          cp /tmp/skel/android/gradlew android/gradlew
          cp /tmp/skel/android/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
      - run: flutter pub get
      - name: Install semantic-release
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save semantic-release@24 @semantic-release/exec@7
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
